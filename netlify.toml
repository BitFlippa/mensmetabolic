# Netlify config for mensmetabolic.com
#
# This repo IS the site root, so leave the Netlify **Base directory** blank
# (Site configuration > Build & deploy > Build settings). Netlify reads this
# file from the root and runs the build below. The build command and publish
# directory here are authoritative, so you don't need to set them in the UI.
# Forms (visit-request, eligibility-quiz) are detected automatically from
# forms.html at build time.
#
# Custom domain: add mensmetabolic.com + www in Site configuration > Domain
# management, set www.mensmetabolic.com as the primary domain (matches
# BASE_URL in src/build.py), and Netlify will 301-redirect the apex to www
# and provision HTTPS automatically. If you'd rather make the apex primary,
# change BASE_URL in src/build.py to https://mensmetabolic.com and rebuild so
# canonicals/sitemap/OG tags stay in sync.

[build]
  command = "python3 src/build.py"
  publish = "dist"

# Canonicalize the bare index file.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Security headers, applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"

# Long-cache immutable static assets (images, icons).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always revalidate so content updates ship immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
